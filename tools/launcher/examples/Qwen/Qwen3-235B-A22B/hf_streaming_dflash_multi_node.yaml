# DFlash streaming speculative-decoding training for Qwen3-235B-A22B (multi-node).
#
# Qwen3-235B-A22B has 94 hidden layers. Five draft inputs and the final hidden
# state require capture ids [2,25,47,69,92,94]. One four-GPU node serves the
# target at TP=4 while a second four-GPU node trains the fake-base draft.

job_name: Qwen3-235B-A22B_DFlash_streaming_multi_node
pipeline:
  allow_to_fail: false
  skip: false
  note:

  global_vars:
    hf_model: /hf-local/Qwen/Qwen3-235B-A22B
    dflash_block_size: "8"
    dflash_loss_decay_factor: "4"

  task_0:
    script: common/eagle3/make_dataset.sh
    args:
      - -f modules/Model-Optimizer/examples/dataset/example_data_config.yaml
      - --full-conversations
    slurm_config:
      _factory_: "slurm_factory"
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 1
      container: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc20

  task_1:
    script: common/eagle3/train_eagle_streaming.sh
    args:
      - --config modules/Model-Optimizer/modelopt_recipes/general/speculative_decoding/dflash.yaml
      - model.model_name_or_path=<<global_vars.hf_model>>
      - model.use_fake_base_for_offline=true
      - data.mode=streaming
      - data.data_path=/scratchspace/data/train.jsonl
      - training.output_dir=/scratchspace/dflash
      - training.training_seq_len=4096
      - training.disable_tqdm=true
      - training.answer_only_loss=false
      - training.num_train_epochs=1
      - training.max_steps=2000
      - training.report_to=none
      - dflash.dflash_block_size=<<global_vars.dflash_block_size>>
      - dflash.dflash_num_anchors=512
      - dflash.dflash_loss_decay_factor=<<global_vars.dflash_loss_decay_factor>>
      - dflash.dflash_mask_token_id=151669
      - dflash.dflash_architecture_config.num_hidden_layers=5
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
      - EAGLE_CAPTURE_IDS: "[2,25,47,69,92,94]"
      - SERVE_TP: "4"
      - SERVE_NODES: "1"
      - STREAMING_NUM_WORKERS: "4"
      - SERVE_MAX_MODEL_LEN: "8192"
      - EXPORT_EXTRA_ARGS: "--trust_remote_code"
    slurm_config:
      _factory_: "slurm_factory"
      nodes: 2
      ntasks_per_node: 1
      gpus_per_node: 4
      container: vllm/vllm-openai:latest

  task_2:
    script: common/specdec/vllm_smoke_test.sh
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
      - DRAFT_MODEL: /scratchspace/export
      - SPEC_METHOD: "dflash"
      - NUM_SPEC_TOKENS: "7"
      - MIN_ACCEPTANCE_LENGTH: "1.2"
      - TP_SIZE: "4"
    slurm_config:
      _factory_: "slurm_factory"
      container: "vllm/vllm-openai:nightly"
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 4
