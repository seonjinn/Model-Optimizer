# DSpark streaming speculative-decoding training for Qwen3-30B-A3B (multi-node).
#
# Task 1 runs two TP=2 serve replicas alongside two DDP trainer nodes. Hidden
# states move from serve to trainer over NIXL RDMA.
# B16 coupled override:
#   pipeline.global_vars.dflash_block_size=16 pipeline.global_vars.num_spec_tokens=16
#   pipeline.global_vars.dflash_loss_decay_factor=7
# Reuse staged data with: pipeline.task_0.skip=true pipeline.global_vars.hf_data=<path>
# Supply the pinned deployment artifacts at launch time:
#   pipeline.global_vars.modelopt_runtime=<runtime> pipeline.task_1.slurm_config.container=<image>
#   pipeline.task_2.slurm_config.container=<image>

job_name: Qwen3-30B-A3B_DSpark_streaming_multi_node
pipeline:
  allow_to_fail: false
  skip: false
  note:

  global_vars:
    hf_model: /hf-local/Qwen/Qwen3-30B-A3B
    hf_data: /scratchspace/data/train.jsonl
    sample_size: "50000"
    report_to: wandb
    run_name: Qwen3-30B-A3B_DSpark_streaming_multi_node
    dflash_block_size: "8"
    dflash_loss_decay_factor: "4"
    num_spec_tokens: "8"

  task_0:
    skip: false
    script: common/eagle3/make_dataset.sh
    args:
      - -f modules/Model-Optimizer/examples/dataset/example_data_config.yaml
      - --full-conversations
    slurm_config:
      _factory_: "slurm_factory"
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 1
      container: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc20

  task_1:
    script: common/eagle3/train_eagle_streaming.sh
    args:
      - --config modules/Model-Optimizer/modelopt_recipes/general/speculative_decoding/dspark.yaml
      - model.model_name_or_path=<<global_vars.hf_model>>
      - model.use_fake_base_for_offline=true
      - data.mode=streaming
      - data.data_path=<<global_vars.hf_data>>
      - data.sample_size=<<global_vars.sample_size>>
      - training.output_dir=/scratchspace/dspark
      - training.training_seq_len=4096
      - training.disable_tqdm=true
      - training.answer_only_loss=false
      - training.num_train_epochs=1
      - training.max_steps=2000
      - training.seed=42
      - training.report_to=<<global_vars.report_to>>
      - training.run_name=<<global_vars.run_name>>
      - dflash.dflash_block_size=<<global_vars.dflash_block_size>>
      # DSpark's paper loss applies static exp(-k/gamma) position weights to
      # CE, TVD, and confidence BCE. Make that objective explicit.
      - dflash.dflash_loss_objective=decay
      - dflash.dflash_loss_decay_factor=<<global_vars.dflash_loss_decay_factor>>
      - dflash.dflash_mask_token_id=151669
      - dflash.dflash_architecture_config.num_hidden_layers=5
      - dflash.dflash_architecture_config.num_attention_heads=32
      - dflash.dflash_architecture_config.num_key_value_heads=4
      - dflash.dflash_architecture_config.head_dim=128
      - dflash.dflash_architecture_config.intermediate_size=6144
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
      - MODELOPT_RUNTIME: <<global_vars.modelopt_runtime>>
      - WANDB_PROJECT: "sna-modelopt-specdec"
      - WANDB_LOG_MODEL: "false"
      - WANDB_WATCH: "false"
      - WANDB_DIR: "/tmp/wandb"
      - EAGLE_CAPTURE_IDS: "[2,13,24,35,46,48]"
      - SERVE_TP: "2"
      - SERVE_NODES: "2"
      - STREAMING_NUM_WORKERS: "4"
      # Six captured hidden-state planes do not fit the default TP2 KV page at
      # block 16; block 32 provides sufficient page capacity.
      - SERVE_BLOCK_SIZE: "32"
      - SERVE_MAX_MODEL_LEN: "8192"
      - SERVE_READY_TIMEOUT: "1800"
      - EXPORT_EXTRA_ARGS: "--trust_remote_code"
    slurm_config:
      _factory_: "slurm_factory"
      nodes: 4
      ntasks_per_node: 1
      gpus_per_node: 2
      container: vllm/vllm-openai:latest

  task_2:
    script: common/specdec/vllm_smoke_test.sh
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
      - DRAFT_MODEL: /scratchspace/export
      - SPEC_METHOD: "dspark"
      - NUM_SPEC_TOKENS: <<global_vars.num_spec_tokens>>
      - MIN_ACCEPTANCE_LENGTH: "1.2"
      - TP_SIZE: "2"
    slurm_config:
      _factory_: "slurm_factory"
      container: vllm/vllm-openai:nightly
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 2
